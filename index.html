<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Muay Thai Edu</title><style>
:root{--r:#d71920;--k:#0b0d10;--g:#168957;--bg:#f4f6f8;--m:#6b7785;--l:#e1e5e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#151a21}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:78px}.hero{height:210px;background:radial-gradient(circle at 76% 40%,#7f1116,#1a0c0e 25%,#0b0d10 65%);color:white;padding:62px 20px 20px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:25px;top:52px;width:135px;height:95px;border-radius:55% 45% 50% 45%;background:linear-gradient(145deg,#be1820,#52090d 55%,#111);transform:rotate(-18deg);box-shadow:-38px 28px 0 -18px #050607}.hero h1{position:relative;z-index:2;margin:22px 0 2px;font-size:31px;line-height:.9}.hero h1 span{display:block;color:#f22d35;font-size:44px}.hero small{position:relative;z-index:2;opacity:.7}.screen{display:none;padding:13px}.screen.on{display:block}.card{background:white;border:1px solid var(--l);border-radius:17px;padding:14px;margin-bottom:11px}.top{display:flex;justify-content:space-between;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{text-align:center;background:#f0f3f5;border-radius:13px;padding:12px 3px}.stat:nth-child(2){background:#e4f5ec}.stat:nth-child(3){background:#ffebec}.n{font-size:29px;font-weight:850}.stat:nth-child(2) .n{color:var(--g)}.stat:nth-child(3) .n{color:var(--r)}.lab{font-size:11px}.prog{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{border:1px solid var(--l);border-radius:13px;padding:12px}.box b{font-size:12px}.cnt{font-size:19px;font-weight:800;margin-top:8px}.btn{border:0;border-radius:11px;min-height:46px;font-weight:800}.primary{width:100%;background:var(--r);color:white;margin-top:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.yes{background:var(--g);color:white}.no{background:var(--r);color:white}h2{font-size:16px;margin:0 0 9px}.big{font-size:18px;font-weight:800}.muted{font-size:12px;color:var(--m)}.lesson{display:grid;grid-template-columns:50px 1fr auto;gap:8px;padding:11px 0;border-top:1px solid var(--l)}.lesson:first-child{border-top:0}.lesson b{font-size:13px}.lesson small{color:var(--m)}.badge{font-size:10px;font-weight:800;border-radius:99px;padding:5px 7px;height:max-content}.real{background:#e4f5ec;color:var(--g)}.miss{background:#ffebec;color:var(--r)}.prev{background:#edf0f3;color:#667382}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tab{border:0;border-radius:9px;background:#e9edf1;padding:9px 13px;white-space:nowrap}.tab.on{background:var(--r);color:white}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.month button{border:1px solid var(--l);background:white;border-radius:10px;width:40px;height:40px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:10px;color:var(--m)}.cal{gap:3px}.cell{min-height:45px;background:#f7f8f9;border-radius:8px;padding:5px 1px;font-size:12px}.blank{background:transparent}.mark{display:block;font-weight:900;margin-top:3px}.ok{color:var(--g)}.x{color:var(--r)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:white;border-top:1px solid var(--l);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#687585;min-height:46px}.nav button.on{color:var(--r);font-weight:800}.modal{display:none;position:fixed;inset:0;background:#05080ca8;z-index:10;align-items:flex-end}.sheet{background:white;width:min(520px,100%);margin:auto;border-radius:22px 22px 0 0;padding:18px 15px calc(20px + env(safe-area-inset-bottom))}.reasons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.reason{border:1px solid var(--l);background:white;border-radius:10px;padding:11px 5px}.reason.sel{border-color:var(--r);background:#ffebec;color:var(--r)}textarea{width:100%;margin-top:10px;border:1px solid #ccd4dc;border-radius:10px;padding:11px;font:inherit}
</style></head><body><div class="app"><header class="hero"><h1>MUAY THAI <span>EDU</span></h1><small>FOCO • DISCIPLINA • EVOLUÇÃO</small></header><main>
<section id="home" class="screen on"><div class="card top"><span>📅 Início <b>05/09/2026</b></span><b>R$ 3.170</b></div><div class="card"><div class="stats"><div class="stat"><div class="n">36</div><div class="lab">Contratadas</div></div><div class="stat"><div class="n" id="done">2</div><div class="lab">Realizadas</div></div><div class="stat"><div class="n" id="left">34</div><div class="lab">Restantes</div></div></div></div><div class="card"><div class="prog"><div class="box"><b>🏠 DOMICÍLIO</b><div class="cnt"><span id="hd">1</span> / 26</div></div><div class="box"><b>📍 PORTO</b><div class="cnt"><span id="pd">1</span> / 10</div></div></div></div><div class="card"><h2>PRÓXIMA AULA</h2><div id="next"></div><div class="actions"><button id="yes" class="btn yes">✓ Compareceu</button><button id="no" class="btn no">✕ Não teve aula</button></div></div><div class="card"><h2>ÚLTIMOS REGISTROS</h2><div id="recent"></div></div></section>
<section id="calendar" class="screen"><div class="month"><button id="pm">‹</button><b id="mt"></b><button id="nm">›</button></div><div class="card"><div class="week"><span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span></div><div id="cal" class="cal"></div><p class="muted">🟢 Realizada &nbsp; ❌ Não teve aula &nbsp; ⚪ Prevista</p></div></section>
<section id="history" class="screen"><div class="tabs"><button class="tab on" data-f="all">Todas</button><button class="tab" data-f="Realizada">Realizadas</button><button class="tab" data-f="Não realizada">Não realizadas</button></div><div class="card" id="hist"></div></section></main>
<nav class="nav"><button class="on" data-s="home">⌂<br>Início</button><button data-s="calendar">▦<br>Calendário</button><button data-s="history">≡<br>Histórico</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><h2 id="mh">Confirmar aula</h2><div id="ms" class="muted"></div><div id="rs" style="display:none"><p>Por que não teve aula?</p><div class="reasons"><button class="reason">Edu não pôde</button><button class="reason">Professor cancelou</button><button class="reason">Feriado</button><button class="reason">Doença</button><button class="reason">Reagendada</button><button class="reason">Outro</button></div></div><textarea id="note" placeholder="Observação (opcional)"></textarea><button id="save" class="btn primary">Salvar</button></div></div>
<script>
const seed=[["2026-09-05","Porto","11:15","Realizada",""],["2026-09-07","Domicílio","14:00","Não realizada","Feriado"],["2026-09-09","Domicílio","14:00","Não realizada","Prova do Dudu"],["2026-09-12","Domicílio","11:15","Realizada",""],["2026-09-14","Domicílio","14:00","Não realizada","Virose"],["2026-09-16","Domicílio","14:00","Não realizada","Virose"],["2026-09-19","Porto","11:15","Prevista",""],["2026-09-21","Domicílio","14:00","Prevista",""],["2026-09-23","Domicílio","14:00","Prevista",""],["2026-09-26","Porto","11:15","Prevista",""],["2026-09-28","Domicílio","14:00","Prevista",""],["2026-09-30","Domicílio","14:00","Prevista",""]].map(x=>({date:x[0],place:x[1],time:x[2],status:x[3],note:x[4]}));let L=JSON.parse(localStorage.getItem("muayEdu")||"null")||seed,cur=null,mode="",reason="",vm=8,vy=2026;const $=x=>document.getElementById(x);function f(d){return d.slice(8)+"/"+d.slice(5,7)}function row(x){return '<div class="lesson"><b>'+f(x.date)+'</b><div><b>'+x.place+' • '+x.time+'</b><br><small>'+x.note+'</small></div><span class="badge '+(x.status==="Realizada"?"real":x.status==="Prevista"?"prev":"miss")+'">'+x.status+'</span></div>'}function render(){let done=L.filter(x=>x.status==="Realizada"),h=done.filter(x=>x.place==="Domicílio").length,p=done.filter(x=>x.place==="Porto").length;$("done").textContent=done.length;$("left").textContent=36-done.length;$("hd").textContent=h;$("pd").textContent=p;let nx=L.find(x=>x.status==="Prevista");$("next").innerHTML=nx?'<div class="big">'+f(nx.date)+' • '+nx.time+'</div><div class="muted">'+nx.place+'</div>':"";$("yes").onclick=()=>open(nx,"yes");$("no").onclick=()=>open(nx,"no");$("recent").innerHTML=L.filter(x=>x.status!=="Prevista").slice(-4).reverse().map(row).join("");hist("all");cal();localStorage.setItem("muayEdu",JSON.stringify(L))}function open(x,m){cur=x;mode=m;reason="";$("ms").textContent=f(x.date)+" • "+x.place+" • "+x.time;$("rs").style.display=m==="no"?"block":"none";document.querySelectorAll(".reason").forEach(b=>b.classList.remove("sel"));$("modal").style.display="flex"}document.querySelectorAll(".reason").forEach(b=>b.onclick=()=>{reason=b.textContent;document.querySelectorAll(".reason").forEach(z=>z.classList.toggle("sel",z===b))});$("save").onclick=()=>{if(mode==="no"&&!reason)return alert("Selecione a justificativa.");cur.status=mode==="yes"?"Realizada":"Não realizada";cur.note=mode==="yes"?$("note").value:(reason+($("note").value?" • "+$("note").value:""));$("modal").style.display="none";$("note").value="";render()};function hist(flt){let a=L.filter(x=>x.status!=="Prevista"&&(flt==="all"||x.status===flt));$("hist").innerHTML=a.slice().reverse().map(row).join("")}function cal(){let names=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];$("mt").textContent=names[vm]+" "+vy;let first=new Date(Date.UTC(vy,vm,1)).getUTCDay(),days=new Date(Date.UTC(vy,vm+1,0)).getUTCDate(),o="";for(let i=0;i<first;i++)o+='<div class="cell blank"></div>';for(let d=1;d<=days;d++){let ds=vy+"-"+String(vm+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),x=L.find(z=>z.date===ds),m=x?'<span class="mark '+(x.status==="Realizada"?"ok":x.status==="Prevista"?"":"x")+'">'+(x.status==="Realizada"?"●":x.status==="Prevista"?"○":"×")+'</span>':"";o+='<div class="cell">'+d+m+'</div>'}$("cal").innerHTML=o}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(b.dataset.s).classList.add("on");document.querySelectorAll(".nav button").forEach(n=>n.classList.toggle("on",n===b))});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));hist(b.dataset.f)});$("pm").onclick=()=>{if(--vm<0){vm=11;vy--}cal()};$("nm").onclick=()=>{if(++vm>11){vm=0;vy++}cal()};render();
</script></body></html>
